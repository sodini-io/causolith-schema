name: Verify Draft 4 checksums

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify locked schema bytes
        shell: bash
        run: |
          set -euo pipefail
          test -f schema-lock.json
          while IFS=$'\t' read -r digest path; do
            test -n "$digest" && test -n "$path"
            printf '%s  %s\n' "$digest" "$path" | sha256sum --check --strict
          done < <(
            python3 - <<'PY'
            import json
            from pathlib import Path
            lock = json.loads(Path('schema-lock.json').read_text())
            for path, digest in sorted(lock['draft4_sources'].items()):
                print(f'{digest}\tschemas/0.1-draft.4/{path}')
            PY
          )
